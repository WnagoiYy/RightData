name: RightData release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new version after all checks (leave false for build/cache testing)
        type: boolean
        default: false
      windows_only:
        description: Build and test only the Windows client (never publishes)
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  server-linux:
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: false
      - name: Build and test with glibc 2.28
        shell: bash
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -v "$(go env GOROOT):/opt/go:ro" -w /work \
            -e GITHUB_SHA quay.io/pypa/manylinux_2_28_x86_64@sha256:076b19ef6e698f28649fa817c49d14443201e01da85240e8e52f93e8daa49bff \
            bash deploy/github/build-server-linux.sh
      - name: Sign Linux server package
        env:
          RIGHTDATA_UPDATE_SIGNING_KEY: ${{ secrets.RIGHTDATA_UPDATE_SIGNING_KEY }}
        run: node deploy/github/sign-server.mjs test/artifacts/release/RightDataServer-$(node -p 'require("./client/package.json").version')-linux-x64.tar.gz linux
      - name: Verify real systemd installation
        shell: bash
        run: |
          version=$(node -p 'require("./client/package.json").version')
          sudo bash "test/build/server-linux-$version/install.sh"
          sudo systemctl restart rightdata-server
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8003/api/probe | python3 -c 'import sys,json; p=json.load(sys.stdin)["data"]; assert p["service"]=="RightData" and p["ready"]'; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8003/api/probe | python3 -c 'import sys,json; assert json.load(sys.stdin)["data"]["ready"]'
          test "$(systemctl show rightdata-server -p User --value)" = rightdata
          sudo systemctl stop rightdata-server
      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-x64
          path: test/artifacts/release/*
          if-no-files-found: error
  server:
    if: ${{ !inputs.windows_only }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache-dependency-path: |
            server/go.sum
            test/server/go.sum
      - name: Locate MinGW
        shell: pwsh
        run: |
          $gcc = Get-ChildItem C:/mingw64/bin/gcc.exe, C:/msys64/mingw64/bin/gcc.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $gcc) { throw 'MinGW GCC is required' }
          $gcc.DirectoryName >> $env:GITHUB_PATH
      - name: Test, package and sign server
        shell: pwsh
        env:
          CGO_ENABLED: '1'
          RIGHTDATA_UPDATE_SIGNING_KEY: ${{ secrets.RIGHTDATA_UPDATE_SIGNING_KEY }}
        run: ./deploy/github/build-server.ps1
      - name: Verify deployment package rejection cases
        run: node --test test/client/server-package.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: server-windows-x64
          path: test/artifacts/release/*
          if-no-files-found: error
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows_only && '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","name":"windows-x64"}]' || '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","name":"windows-x64"},{"os":"macos-15","target":"aarch64-apple-darwin","name":"macos-arm64"},{"os":"macos-15-intel","target":"x86_64-apple-darwin","name":"macos-x64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/client/target
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      RIGHTDATA_PUBLIC_UPDATE_URL: ${{ vars.RIGHTDATA_PUBLIC_UPDATE_URL }}
      RIGHTDATA_GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Rust target
        run: |
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          rustup default 1.99.1
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Never prune two independent dependency graphs in the same target.
          prefix-key: v1-separated-targets
          workspaces: |
            client/network-service -> target
            client/src-tauri -> ../target
          key: ${{ matrix.target }}
          cache-on-failure: true
      - name: Install frontend dependencies
        working-directory: client
        run: npm ci
      - name: Network service unit tests
        run: cargo test --locked --manifest-path client/network-service/Cargo.toml --target-dir client/network-service/target
      - name: Windows installer session regression tests
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./test/client/installer-session.ps1
          & "$env:SystemRoot/SysWOW64/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -ExecutionPolicy Bypass -File test/client/installer-session.ps1
          if ($LASTEXITCODE) { throw '32-bit installer regression failed' }
          node --test test/client/service-install-contract.test.mjs
          if ($LASTEXITCODE) { throw 'Installer contracts failed' }
      - name: Frontend build
        working-directory: client
        run: npm run build
      - name: Discovery protocol tests
        run: node --test test/client/discovery-service.test.mjs
      - name: Verify development and production defaults
        shell: bash
        run: |
          mkdir -p test/build
          rustc --test client/platform/build_defaults.rs -o test/build/defaults-debug
          ./test/build/defaults-debug
          rustc --test -C debug-assertions=no client/platform/build_defaults.rs -o test/build/defaults-release
          ./test/build/defaults-release
      - name: Prepare test bundle resource
        run: node deploy/github/prepare-test-resource.mjs
      - name: Native client unit tests
        run: cargo test --locked --manifest-path client/src-tauri/Cargo.toml --lib
      - name: Unix service integration
        if: runner.os == 'macOS'
        run: python3 test/client/network-service-unix.py
      - name: Build and sign packages
        env:
          RIGHTDATA_UPDATE_SIGNING_KEY: ${{ secrets.RIGHTDATA_UPDATE_SIGNING_KEY }}
        run: node deploy/github/build-release.mjs ${{ matrix.target }}
      - name: Real Windows installer lifecycle
        if: runner.os == 'Windows'
        # Exercise the inherited PowerShell 7 environment as well as the
        # installer's actual Windows PowerShell 5.1 child process.
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem test/artifacts/release/RightData-*-windows-x64.exe)
          if ($packages.Count -ne 1) { throw 'Expected exactly one installer' }
          ./test/client/installer-integration.ps1 -Package $packages[0].FullName
      - name: Real macOS package startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(node -p 'require("./client/package.json").version')
          if [[ '${{ matrix.target }}' == aarch64-apple-darwin ]]; then
            package_arch=arm64
            binary_arch=arm64
          else
            package_arch=x64
            binary_arch=x86_64
          fi
          python3 test/client/installer-macos.py \
            --package "test/artifacts/release/RightData-$version-macos-$package_arch.dmg" \
            --expected-version "$version" --expected-arch "$binary_arch"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: test/artifacts/release/*
          if-no-files-found: error
  publish:
    if: ${{ !inputs.windows_only && (startsWith(github.ref, 'refs/tags/v') || inputs.publish) }}
    needs: [build, server, server-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: test/artifacts/release
          merge-multiple: true
      - name: Publish client and server packages together
        env:
          GH_TOKEN: ${{ github.token }}
        run: node deploy/github/publish-release.mjs
