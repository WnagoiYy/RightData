name: Verify published release
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['RightData release']
    types: [completed]
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and independently verify every published package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node deploy/github/verify-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: test/results/release-verification.json
          if-no-files-found: error
