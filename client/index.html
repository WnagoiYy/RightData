<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>贵州权益数据平台</title>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      body { background: #f4f8ff; }
      .boot-shell { height: 100%; display: flex; align-items: center; justify-content: center; gap: 12px; color: #7c8db1; font: 14px "Microsoft YaHei", "PingFang SC", sans-serif; }
      .boot-shell::before { width: 22px; height: 22px; content: ""; border: 2px solid #c8d8f3; border-top-color: #0066ff; border-radius: 50%; animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-shell::before { animation: none; } }
    </style>
  </head>

  <body>
    <div id="root"><div class="boot-shell" role="status">正在启动…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
