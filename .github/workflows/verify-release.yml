name: Verify published release
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact published version to verify, or empty for latest stable
        type: string
        default: ''
      test_service_script:
        description: Test the current service lifecycle script against the signed service binary
        type: boolean
        default: false
      test_installer_hooks:
        description: Rebundle verified binaries with current hooks for installation diagnostics
        type: boolean
        default: false
      test_windows_installer:
        description: Run the real Windows installation lifecycle on an ephemeral runner
        type: boolean
        default: false
  workflow_run:
    workflows: ['RightData release', 'Publish verified build']
    types: [completed]
permissions:
  contents: read
jobs:
  windows-install:
    if: github.event_name == 'workflow_dispatch' && (inputs.test_windows_installer || inputs.test_service_script || inputs.test_installer_hooks)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify signed release before execution
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RIGHTDATA_VERIFY_VERSION: ${{ inputs.release_version || '' }}
        run: node deploy/github/verify-release.mjs
      - name: Verify current Windows service lifecycle script
        if: inputs.test_service_script
        shell: powershell
        run: |
          $version = (Get-Content test/results/release-verification.json -Raw | ConvertFrom-Json).version
          ./test/client/service-lifecycle-integration.ps1 -Package "test/artifacts/release-$version/RightData-$version-windows-x64.exe"
      - name: Install, upgrade, restart, uninstall and reinstall
        if: inputs.test_windows_installer
        shell: powershell
        run: |
          $version = (Get-Content test/results/release-verification.json -Raw | ConvertFrom-Json).version
          ./test/client/installer-integration.ps1 -Package "test/artifacts/release-$version/RightData-$version-windows-x64.exe"
      - name: Diagnose current installer hooks with verified binaries
        if: inputs.test_installer_hooks
        shell: powershell
        run: |
          $version = (Get-Content test/results/release-verification.json -Raw | ConvertFrom-Json).version
          ./test/client/installer-hooks-integration.ps1 -Package "test/artifacts/release-$version/RightData-$version-windows-x64.exe"
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and independently verify every published package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RIGHTDATA_VERIFY_VERSION: ${{ inputs.release_version || '' }}
        run: node deploy/github/verify-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: test/results/release-verification.json
          if-no-files-found: error
