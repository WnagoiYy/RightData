name: RightData release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  server-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: false
      - name: Build and test with glibc 2.28
        shell: bash
        run: |
          docker run --rm -v "$PWD:/work" -v "$(go env GOROOT):/opt/go:ro" -w /work \
            -e GITHUB_SHA quay.io/pypa/manylinux_2_28_x86_64 \
            bash deploy/github/build-server-linux.sh
      - name: Sign Linux server package
        env:
          RIGHTDATA_UPDATE_SIGNING_KEY: ${{ secrets.RIGHTDATA_UPDATE_SIGNING_KEY }}
        run: node deploy/github/sign-server.mjs test/artifacts/release/RightDataServer-$(node -p 'require("./client/package.json").version')-linux-x64.tar.gz linux
      - name: Verify real systemd installation
        shell: bash
        run: |
          version=$(node -p 'require("./client/package.json").version')
          sudo bash "test/build/server-linux-$version/install.sh"
          sudo systemctl restart rightdata-server
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8003/api/probe | python3 -c 'import sys,json; p=json.load(sys.stdin)["data"]; assert p["service"]=="RightData" and p["ready"]'; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8003/api/probe | python3 -c 'import sys,json; assert json.load(sys.stdin)["data"]["ready"]'
          test "$(systemctl show rightdata-server -p User --value)" = rightdata
          sudo systemctl stop rightdata-server
      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-x64
          path: test/artifacts/release/*
          if-no-files-found: error
  server:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache-dependency-path: |
            server/go.sum
            test/server/go.sum
      - name: Locate MinGW
        shell: pwsh
        run: |
          $gcc = Get-ChildItem C:/mingw64/bin/gcc.exe, C:/msys64/mingw64/bin/gcc.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $gcc) { throw 'MinGW GCC is required' }
          $gcc.DirectoryName >> $env:GITHUB_PATH
      - name: Test, package and sign server
        shell: pwsh
        env:
          CGO_ENABLED: '1'
          RIGHTDATA_UPDATE_SIGNING_KEY: ${{ secrets.RIGHTDATA_UPDATE_SIGNING_KEY }}
        run: ./deploy/github/build-server.ps1
      - name: Verify deployment package rejection cases
        run: node --test test/client/server-package.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: server-windows-x64
          path: test/artifacts/release/*
          if-no-files-found: error
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/client/target
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      RIGHTDATA_PUBLIC_UPDATE_URL: ${{ vars.RIGHTDATA_PUBLIC_UPDATE_URL }}
      RIGHTDATA_GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Rust target
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            client/network-service -> ../target
            client/src-tauri -> ../target
          key: ${{ matrix.target }}
      - name: Install frontend dependencies
        working-directory: client
        run: npm ci
      - name: Network service unit tests
        run: cargo test --locked --manifest-path client/network-service/Cargo.toml
      - name: Windows installer session regression tests
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./test/client/installer-session.ps1
          & "$env:SystemRoot/SysWOW64/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -ExecutionPolicy Bypass -File test/client/installer-session.ps1
          if ($LASTEXITCODE) { throw '32-bit installer regression failed' }
          node --test test/client/service-install-contract.test.mjs
          if ($LASTEXITCODE) { throw 'Installer contracts failed' }
      - name: Frontend build
        working-directory: client
        run: npm run build
      - name: Verify development and production defaults
        shell: bash
        run: |
          mkdir -p test/build
          rustc --test client/platform/build_defaults.rs -o test/build/defaults-debug
          ./test/build/defaults-debug
          rustc --test -C debug-assertions=no client/platform/build_defaults.rs -o test/build/defaults-release
          ./test/build/defaults-release
      - name: Prepare test bundle resource
        run: node deploy/github/prepare-test-resource.mjs
      - name: Native client unit tests
        run: cargo test --locked --manifest-path client/src-tauri/Cargo.toml --lib
      - name: Unix service integration
        if: runner.os == 'macOS'
        run: python3 test/client/network-service-unix.py
      - name: Build and sign packages
        env:
          RIGHTDATA_UPDATE_SIGNING_KEY: ${{ secrets.RIGHTDATA_UPDATE_SIGNING_KEY }}
        run: node deploy/github/build-release.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: test/artifacts/release/*
          if-no-files-found: error
  publish:
    needs: [build, server, server-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: test/artifacts/release
          merge-multiple: true
      - name: Publish client and server packages together
        env:
          GH_TOKEN: ${{ github.token }}
        run: node deploy/github/publish-release.mjs
